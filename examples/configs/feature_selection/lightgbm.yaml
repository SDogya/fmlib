# LightGBM + SHAP с настраиваемым пространством поиска Optuna.
#
# Если params.parameters не содержит ни одной мапы, Optuna берёт целиком
# LIGHTGBM_SEARCH_SPACE из
# fmlib/feature_selection/utils/default_model_param_spaces.py.
# Любая мапа в YAML полностью заменяет этот fallback: незаданные ключи
# из дефолта не подмешиваются. Скаляр уходит в модель как есть.
#
# Корневой order — единственный список шагов. ${...} — ссылки OmegaConf.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - low_variance: ${statistics.low_variance}
  - correlation: ${statistics.correlation}
  - lightgbm: ${model}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000
  low_variance:
    min_variance: 0.01
    scale_method: robust
  correlation:
    threshold: 0.95
    max_rows: 500000

model:
  enabled: true
  method: lightgbm

  params:
    max_rows: 250000
    sample_fraction: null
    n_folds: 5
    optuna_mode: global      # global — подбор один раз; per_fold — на каждом фолде
    n_jobs: -1
    seed: 17                 # иначе execution.seed
    shap_max_rows: 5000

    # Блок общий для всех методов с Optuna (lightgbm, catboost_rfe, boruta_shap).
    # Устаревший ключ params.n_trials уровнем выше ещё читается как запасной.
    optuna_params:
      enabled: true          # false — сразу обучение на скалярах, без Optuna
      n_trials: 30
      n_startup_trials: 10
      sampler: TPE           # TPE | RANDOM | GRID
      timeout: null          # секунды или null

    # Отбор. selection_mode:
    #   aggregated — среднее по фолдам, два кумулятива, пересечение (дефолт);
    #   vote — кумулятив в каждом фолде по split и по SHAP (2*n_folds наборов),
    #          признак живёт если доля наборов >= min_set_share.
    # model.selection.max_features этим селектором НЕ используется.
    selection_mode: aggregated
    min_set_share: 1.0       # только vote; 1.0 = должен быть во всех наборах
    lgbm_threshold: 0.85
    shap_threshold: 0.85

    # Мапа -> вся сетка пользователя (дефолтный файл не подмешивается).
    # Скаляр -> уходит в LightGBM как есть.
    # Без мап при enabled: true берётся LIGHTGBM_SEARCH_SPACE целиком.
    parameters:
      num_leaves:
        type: int
        min: 16
        max: 128
      learning_rate:
        type: float
        min: 0.005
        max: 0.3
        log: true
      min_child_samples: 20  # скаляр: не подбирается

    # objective, metric, verbosity, n_jobs, random_state и внутренние
    # сиды LightGBM проставляются библиотекой принудительно.

precise:
  enabled: false
  method: none

execution:
  seed: 42
  max_local_rows: 1000000
  local_sample:
    strategy: stratified
    cache_intermediate: true
