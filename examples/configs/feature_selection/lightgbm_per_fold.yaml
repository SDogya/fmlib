# LightGBM с Optuna на каждом внешнем фолде (optuna_mode: per_fold).
#
# Дороже global: n_folds независимых подборов. Имеет смысл, если фолды
# сильно разные по периоду/балансу и один набор гиперпараметров врёт.
# Отбор — aggregated (дефолт). Для vote смените selection_mode.
# Отбор только continuous. execution.task_type = schema.task_type.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - lightgbm: ${lightgbm}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

lightgbm:
  max_rows: 250000
  n_folds: 5
  optuna_mode: per_fold
  n_jobs: -1
  seed: 17
  shap_max_rows: 5000
  selection_mode: aggregated
  lgbm_threshold: 0.85
  shap_threshold: 0.85
  optuna_params:
    enabled: true
    n_trials: 15
    n_startup_trials: 5
    sampler: TPE
    timeout: 1800
  parameters:
    num_leaves:
      type: int
      min: 16
      max: 255
    colsample_bytree:
      type: float
      min: 0.5
      max: 1.0
    subsample:
      type: float
      min: 0.5
      max: 1.0
    min_child_weight:
      type: float
      min: 1.0e-3
      max: 10.0
      log: true

execution:
  seed: 42
  task_type: binary_classification
  max_local_rows: 1000000
