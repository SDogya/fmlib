# Полный пайплайн: statistics → catboost_rfe → boruta_shap.
#
# Корневой order — единственный список шагов. Метод, не попавший
# в список, не запускается, даже если его блок параметров описан ниже.
#
# Оценка времени на ~2500 признаках и 700k строк: statistics — минуты,
# catboost_rfe — часы (основной вклад — Optuna), boruta_shap — часы
# (основной вклад — SHAP по строкам). См. комментарии в блоках.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - low_variance: ${statistics.low_variance}
  - correlation: ${statistics.correlation}
  - catboost_rfe: ${model}
  - boruta_shap: ${precise.params}

preprocessing:
  feature_drop:
    enabled: false
    path: null               # текстовый файл со списком признаков к исключению
    strict: false            # true — падать, если признака из файла нет в схеме
  random_feature_drop:
    enabled: false           # только для тестовых прогонов
    n_features: 0
  row_sample:
    enabled: false           # только для тестовых прогонов
    max_rows: null
    stratified: true

statistics:
  null_rate:
    threshold: 0.95          # доля пропусков, выше которой признак отбрасывается

  constants:
    max_frequency: 0.98      # доля самого частого значения
    chunk_size: 1000         # колонок за один Spark-запрос

  low_variance:
    min_variance: 0.01
    # scale_method: standard делает дисперсию равной 1 для всех колонок,
    # и min_variance перестаёт работать. Нужен minmax или robust.
    scale_method: robust

  correlation:
    threshold: 0.95
    tie_break: null_rate     # кого выбрасывать из коррелирующей пары
    # Берёт ПЕРВЫЕ max_rows строк через .limit(), а не случайную выборку.
    # На данных, партиционированных по времени, это первые месяцы.
    max_rows: 500000

  # Блоки ниже описаны, но в order их нет — не запустятся.
  # psi роняет прогон на строковых категориальных: approxQuantile
  # вызывается по всем кандидатам без фильтрации по типу.
  psi:
    mode: month_over_month
    threshold: 0.25
    num_bins: 10
    month_column: month_part
    test_months: 1

  iv:
    threshold: 0.02          # ниже — признак не несёт сигнала
    max_threshold: 1.5       # выше — подозрение на утечку таргета
    num_bins: 10

model:
  enabled: true
  method: catboost_rfe

  params:
    eval_months: 1           # последние N периодов schema.time → out-of-time eval
    max_rows: 500000
    sample_fraction: 0.1     # доля от max_rows: 500000 × 0.1 = 50k строк на обучение

    # Мапа → вся сетка Optuna (дефолтный файл не подмешивается).
    # Скаляр → уходит в CatBoost как есть.
    # Нет мап и enabled: true → CATBOOST_RFE_SEARCH_SPACE.
    # lr / ES: скаляр в YAML остаётся; ключа нет — таблица по n_rows. Optuna их не ищет.
    parameters:
      loss_function: Logloss
      eval_metric: AUC
      use_best_model: true
      max_ctr_complexity: 1  # отключает комбинации категориальных; иначе комбинаторный рост
      task_type: CPU
      boosting_type: Plain   # Ordered точнее на малых выборках, но заметно медленнее
      depth:
        type: int
        min: 3
        max: 7
      l2_leaf_reg:
        type: float
        min: 1.0e-8
        max: 10.0
        log: true
      min_data_in_leaf:
        type: int
        min: 1
        max: 20

    optuna_params:
      enabled: true
      n_trials: 20           # ниже 12–15 опускаться не стоит, выше 25 отдача мала
      n_startup_trials: 8    # случайные попытки до включения TPE
      sampler: TPE           # TPE | RANDOM | GRID
      timeout: 3600          # секунды или null; страховка от затянувшегося перебора

    feature_selection_params:
      algorithm: RecursiveByLossFunctionChange
      steps: 20              # больше шагов — точнее траектория, дольше прогон

  selection:
    max_features: 200        # целевое число признаков после элиминации

  cross_validation:
    strategy: stratified     # group и time_based объявлены, но не реализованы
    folds: 3
    metric: roc_auc

precise:
  enabled: true
  method: boruta_shap

  params:
    model_type: lgbm         # lgbm | rf
    # Стоимость BorutaSHAP определяется СТРОКАМИ, а не признаками:
    # SHAP считается по каждой строке. 700k → около 5 часов, 250k → около 2.
    max_rows: 250000
    sample_fraction: null
    boruta_trials: 50        # итераций с теневыми признаками; меньше — больше tentative
    tentative_fix_method: rough   # rough | null

    # boruta_shap оценивает только continuous — категориальные до него не доходят.
    # lr / ES: скаляр в YAML остаётся; ключа нет — таблица по n_rows. Optuna их не ищет.
    parameters:
      boosting_type: gbdt    # скаляр: фиксируем. Без этого в переборе есть dart,
                             # который не поддерживает раннюю остановку и растягивает трайл
      num_leaves:
        type: int
        min: 16
        max: 255
      colsample_bytree:
        type: float
        min: 0.5
        max: 1.0
      subsample:
        type: float
        min: 0.5
        max: 1.0
      min_child_weight:
        type: float
        min: 1.0e-3
        max: 10.0
        log: true

    optuna_params:
      enabled: true
      n_trials: 20
      n_startup_trials: 5
      sampler: TPE
      timeout: 3600

execution:
  seed: 42                   # доходит до сэмплирования, Optuna и random_seed моделей
  task_type: binary_classification  # должно совпасть со schema.task_type
  max_local_rows: 1000000    # общий потолок, срезает params.max_rows сверху
