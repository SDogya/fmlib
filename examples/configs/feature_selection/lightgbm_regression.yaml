# LightGBM на регрессии.
#
# task_type: regression должен совпасть со schema.task_type.
# Пайплайн берёт LGBMRegressor, RMSE, KFold (без стратификации по таргету).
# IV нельзя. PSI и row_sample тоже не стратифицируют по таргету.
# Отбор только continuous.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - low_variance: ${statistics.low_variance}
  - correlation: ${statistics.correlation}
  - lightgbm: ${lightgbm}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000
  low_variance:
    min_variance: 0.01
    scale_method: robust
  correlation:
    threshold: 0.95
    max_rows: 500000

lightgbm:
  max_rows: 250000
  n_folds: 5
  optuna_mode: global
  n_jobs: -1
  seed: 17
  shap_max_rows: 5000
  selection_mode: aggregated
  lgbm_threshold: 0.85
  shap_threshold: 0.85
  optuna_params:
    enabled: true
    n_trials: 30
    n_startup_trials: 10
    sampler: TPE
    timeout: null
  parameters:
    num_leaves:
      type: int
      min: 16
      max: 255
    colsample_bytree:
      type: float
      min: 0.5
      max: 1.0
    subsample:
      type: float
      min: 0.5
      max: 1.0
    min_child_weight:
      type: float
      min: 1.0e-3
      max: 10.0
      log: true

execution:
  seed: 42
  task_type: regression
  max_local_rows: 1000000
