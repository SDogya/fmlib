# LightGBM «как campaign»: vote + пересечение всех фолдов, без Optuna.
#
# Скаляры как в LGMFeatureSelection / ShapFeatureSelection:
#   max_depth=5, n_estimators=500, learning_rate=0.05, без early stopping.
# selection_mode=vote и min_set_share=1.0 — та же алгебра, что LGM ∩ SHAP
# по фолдам. Наборы совпадут с campaign, только если ещё совпали порядок
# строк (у нас hash-sort) и сиды модели (seed + номер фолда с единицы).
# Для одного и того же seed на каждом fold задайте shift_seed_per_fold: false.
#
# n_jobs: 1 — ближе к бит-в-бит повторам. Дока не обещает это при n_jobs != 1.
# Отбор только continuous. execution.task_type = schema.task_type.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - lightgbm: ${lightgbm}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

lightgbm:
  max_rows: 250000
  n_folds: 5
  optuna_mode: global
  n_jobs: 1
  seed: 42
  shift_seed_per_fold: true
  shap_max_rows: 1000000
  selection_mode: vote
  min_set_share: 1.0
  lgbm_threshold: 0.85
  shap_threshold: 0.85
  optuna_params:
    enabled: false
  parameters:
    n_estimators: 500
    max_depth: 5
    learning_rate: 0.05
    early_stopping_rounds: 0

execution:
  seed: 42
  task_type: binary_classification
  max_local_rows: 1000000
