# PSI: train против valid (не month-over-month).
#
# Нужен datasets["valid"] в fit_select либо schema.split со строками valid.
# schema.time не обязателен. Ключ datasets["test"] не читается.
# Непрерывные признаки разбиваются по квантилям, категориальные — по уровням.
# Для регрессии сэмпл не стратифицируется по таргету.

order:
  - psi: ${statistics.psi}

statistics:
  psi:
    mode: train_valid
    threshold: 0.25
    num_bins: 10
    min_bin_share: 0.0  # редкие уровни baseline объединяются в other
    max_levels: 50     # null — без ограничения; новые уровни actual идут в other
    relative_error: 0.001
    batch_size: 100
    n_jobs: -1
    subsample_rows: null

execution:
  seed: 42
  task_type: binary_classification
  max_local_rows: 1000000
