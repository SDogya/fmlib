# CatBoost RFE: за раунд снимается фиксированное число признаков.
#
# feature_selection_params.feature_drop_per_step — вместо steps.
# Оба ключа сразу — ошибка конфига. Последний раунд может быть короче,
# когда до selection.max_features осталось меньше, чем drop.
# Нужен FeatureSchema.time. Бинарный дефолт; для classification/regression
# смените execution.task_type и уберите Logloss/AUC.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - catboost_rfe: ${catboost_rfe}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

catboost_rfe:
  eval_months: 1
  max_rows: 500000
  sample_fraction: 0.1
  parameters:
    loss_function: Logloss
    eval_metric: AUC
    use_best_model: true
    max_ctr_complexity: 1
    boosting_type: Plain
    bootstrap_type: MVS
    task_type: CPU
    depth:
      type: int
      min: 3
      max: 7
    l2_leaf_reg:
      type: float
      min: 1.0e-8
      max: 10.0
      log: true
    min_data_in_leaf:
      type: int
      min: 1
      max: 20
  optuna_params:
    enabled: true
    n_trials: 20
    n_startup_trials: 8
    sampler: TPE
    timeout: 3600
  feature_selection_params:
    algorithm: RecursiveByPredictionValuesChange
    feature_drop_per_step: 16
  selection:
    max_features: 256

execution:
  seed: 42
  task_type: binary_classification
  max_local_rows: 1000000
