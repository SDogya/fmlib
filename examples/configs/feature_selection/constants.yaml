statistics:
  order:
    - null_rate
    - low_variance
    - constants
  null_rate:
    threshold: 0.95
  low_variance:
    min_variance: 0.001
    scale_method: "standard"
  constants:
    max_frequency: 0.98
    chunk_size: 1000

model:
  enabled: true
  # Still a stub until a real model selector is filled in.
  method: lasso
  params: {}
  selection:
    max_features: 100
  cross_validation:
    strategy: stratified
    folds: 5
    metric: roc_auc

precise:
  enabled: false
  method: none

execution:
  seed: 42
  allow_local_fallback: true
  # Used by stages that still materialise locally (e.g. correlation). Unused by constants.
  max_local_rows: 1000000
  local_memory_limit: 4
  local_sample:
    strategy: stratified
    cache_intermediate: true
