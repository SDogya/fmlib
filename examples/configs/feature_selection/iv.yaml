# Information Value. Только binary_classification (+ target в schema).
# На classification / regression шаг падает — не копируйте его туда.
#
# Шаги пайплайна. Повторы метода с разными параметрами разрешены.
# ${statistics.iv} — ссылка OmegaConf на пресет ниже.
order:
  - iv: ${statistics.iv}

statistics:
  iv:
    threshold: 0.02
    num_bins: 10
    max_threshold: null
    eps: 1e-4
    min_bin_share: 0.0
    max_levels: 50
    relative_error: 0.001
    batch_size: 50

model:
  enabled: false
  method: lightgbm
  params: {}
  selection:
    max_features: 100
  cross_validation:
    strategy: stratified
    folds: 5
    metric: roc_auc

precise:
  enabled: false
  method: none

execution:
  seed: 42
  # IV только для binary_classification; должен совпасть со schema.task_type.
  task_type: binary_classification
  allow_local_fallback: true
  max_local_rows: 1000000
  local_memory_limit: 4
  local_sample:
    strategy: stratified
    cache_intermediate: true
