# Корневой order — единственный список шагов. ${...} — ссылки OmegaConf.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - catboost_rfe: ${model}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

model:
  enabled: true
  method: catboost_rfe
  params:
    # Последние N периодов FeatureSchema.time уходят в eval_set:
    # ранняя остановка и важности считаются out-of-time,
    # внешние valid/test селектор не читает.
    eval_months: 1
    max_rows: 500000
    sample_fraction: 0.1

    # Скаляр - используется как есть, мапа - вся сетка пользователя.
    # Чтобы пропустить тюнинг, поставьте optuna_params.enabled: false.
    # lr / ES: скаляр в YAML остаётся; ключа нет — таблица по n_rows. Optuna их не ищет.
    parameters:
      loss_function: Logloss
      eval_metric: AUC
      use_best_model: true
      max_ctr_complexity: 1
      boosting_type: Plain
      bootstrap_type: MVS
      task_type: CPU
      depth:
        type: int
        min: 3
        max: 7
      l2_leaf_reg:
        type: float
        min: 1.0e-8
        max: 10.0
        log: true
      min_data_in_leaf:
        type: int
        min: 1
        max: 20

    optuna_params:
      enabled: true
      n_trials: 50
      n_startup_trials: 10
      sampler: TPE
      timeout: 18000

    feature_selection_params:
      algorithm: RecursiveByLossFunctionChange
      steps: 20

  selection:
    # num_features_to_select для рекурсивной элиминации
    max_features: 256

precise:
  enabled: false
  method: none

execution:
  seed: 42
  task_type: binary_classification  # classification | regression; совпадает со schema.task_type
  max_local_rows: 1000000
  local_sample:
    strategy: stratified
    cache_intermediate: true
