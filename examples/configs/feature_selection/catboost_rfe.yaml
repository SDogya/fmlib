statistics:
  order:
    - null_rate
    - constants
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

model:
  enabled: true
  method: catboost_rfe
  params:
    # Последние N периодов FeatureSchema.time уходят в eval_set:
    # ранняя остановка и важности считаются out-of-time,
    # внешние valid/test селектор не читает.
    eval_months: 1
    max_rows: 500000
    sample_fraction: 0.1

    # Скаляр - используется как есть, мапа - вся сетка пользователя.
    # Чтобы пропустить тюнинг, поставьте optuna_params.enabled: false.
    parameters:
      iterations: 3000
      loss_function: Logloss
      eval_metric: AUC
      early_stopping_rounds: 100
      use_best_model: true
      max_ctr_complexity: 1
      boosting_type: Plain
      bootstrap_type: MVS
      task_type: CPU
      depth:
        type: int
        min: 4
        max: 8
      min_data_in_leaf:
        type: int
        min: 16
        max: 64
      learning_rate:
        type: float
        min: 0.01
        max: 0.3
        log: true
      l2_leaf_reg:
        type: float
        min: 0.5
        max: 30
        log: true
      random_strength:
        type: float
        min: 0.05
        max: 0.2

    optuna_params:
      enabled: true
      n_trials: 50
      n_startup_trials: 10
      sampler: TPE
      timeout: 18000

    feature_selection_params:
      algorithm: RecursiveByLossFunctionChange
      steps: 20

  selection:
    # num_features_to_select для рекурсивной элиминации
    max_features: 256

precise:
  enabled: false
  method: none

execution:
  seed: 42
  max_local_rows: 1000000
  local_sample:
    strategy: stratified
    cache_intermediate: true
