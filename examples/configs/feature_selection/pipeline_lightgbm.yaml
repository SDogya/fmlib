# Полный пайплайн: statistics → lightgbm → boruta_shap.
#
# Корневой order — единственный список шагов. ${...} — ссылки OmegaConf.
# Имя блока-пресета совпадает с именем метода в order, поэтому ключи
# enabled и method не нужны: шаг включается строкой в order, а при наличии
# order оба флага всё равно игнорируются.
#
# Отличия от pipeline_catboost_rfe.yaml:
#   • lightgbm по умолчанию оценивает continuous и categorical нативно
#     насквозь без решения (catboost_rfe — единственный, кто их оценивает);
#   • отбор идёт по кумулятивным порогам важности, а не до фиксированного
#     числа признаков: selection.max_features этим методом НЕ читается;
#   • есть встроенное пространство поиска Optuna, поэтому блок parameters
#     необязателен — без него работают дефолты из кода.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - low_variance: ${statistics.low_variance}
  - correlation: ${statistics.correlation}
  - lightgbm: ${lightgbm}
  - boruta_shap: ${boruta_shap}

# Необязательные preprocessing-шаги. Чтобы включить — добавить строку в order
# и раскомментировать нужный блок; флага enabled здесь нет.
#   - feature_drop: ${feature_drop}
#   - random_feature_drop: ${random_feature_drop}
#   - row_sample: ${row_sample}
# feature_drop:
#   path: drops.json         # относительный путь считается от этого YAML
#   strict: false            # true — падать на неизвестном имени признака
# random_feature_drop:
#   n_features: 100          # случайное прореживание для тестовых прогонов
# row_sample:
#   max_rows: 100000
#   stratified: true

statistics:
  null_rate:
    threshold: 0.95

  constants:
    max_frequency: 0.98
    chunk_size: 1000

  low_variance:
    min_variance: 0.01
    scale_method: robust     # при standard фильтр не работает: дисперсия всегда 1

  correlation:
    threshold: 0.95
    tie_break: null_rate
    max_rows: 500000

lightgbm:
  max_rows: 250000
  sample_fraction: null
  n_folds: 5
  optuna_mode: global        # global — подбор один раз; per_fold — на каждом фолде
  n_jobs: -1
  seed: 17                   # иначе execution.seed
  categorical_handling:
    mode: native
  shap_max_rows: 5000        # строк на расчёт SHAP внутри фолда

  # aggregated — среднее по фолдам, два кумулятива, пересечение.
  # vote — 2*n_folds наборов (split и SHAP в каждом фолде), порог min_set_share.
  selection_mode: aggregated
  min_set_share: 1.0
  # Признак проходит, если попал в кумулятивный порог И по split-важности
  # LightGBM, И по SHAP. Порог 0.85 = «оставить признаки, дающие 85% массы».
  lgbm_threshold: 0.85
  shap_threshold: 0.85

  # Блок необязателен: без мап берутся встроенные диапазоны целиком.
  # Любая мапа в YAML — это вся сетка; остальные дефолтные ключи не
  # подмешиваются. Скаляр уходит в модель как есть.
  # lr / ES: скаляр в YAML остаётся; ключа нет — таблица по n_rows. Optuna их не ищет.
  parameters:
    num_leaves:
      type: int
      min: 16
      max: 255
    colsample_bytree:
      type: float
      min: 0.5
      max: 1.0
    subsample:
      type: float
      min: 0.5
      max: 1.0
    min_child_weight:
      type: float
      min: 1.0e-3
      max: 10.0
      log: true

  optuna_params:
    enabled: true
    n_trials: 30
    n_startup_trials: 10
    sampler: TPE
    timeout: 3600

  # Не используется методом lightgbm, оставлено для переключения на
  # catboost_rfe без правки остального конфига.
  selection:
    max_features: 200

  cross_validation:
    strategy: stratified
    folds: 5
    metric: roc_auc

boruta_shap:
  model_type: lgbm
  n_jobs: -1
  seed: 17                   # иначе execution.seed
  categorical_handling:
    mode: native
  max_rows: 250000           # стоимость определяется строками: SHAP по каждой
  sample_fraction: null
  boruta_trials: 50
  tentative_fix_method: rough

  parameters:
    boosting_type: gbdt      # фиксируем: dart в переборе растягивает трайлы
    # lr / ES: скаляр в YAML остаётся; ключа нет — таблица по n_rows. Optuna их не ищет.
    num_leaves:
      type: int
      min: 16
      max: 255
    colsample_bytree:
      type: float
      min: 0.5
      max: 1.0
    subsample:
      type: float
      min: 0.5
      max: 1.0
    min_child_weight:
      type: float
      min: 1.0e-3
      max: 10.0
      log: true

  optuna_params:
    enabled: true
    n_trials: 20
    n_startup_trials: 5
    sampler: TPE
    timeout: 3600

execution:
  seed: 42
  task_type: binary_classification  # classification | regression; совпадает со schema.task_type
  max_local_rows: 1000000
