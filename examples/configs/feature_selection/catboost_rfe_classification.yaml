# CatBoost RFE на мультиклассе.
#
# task_type: classification (не multiclass) = schema.task_type.
# Пайплайн сам ставит loss_function: MultiClass. Не копируйте сюда
# бинарные Logloss / AUC — eval_metric AUC на MultiClass не тот контракт.
# Нужен FeatureSchema.time: последние eval_months периодов идут в OOT eval.
# Оценивает и continuous, и categorical. IV в этот order не ставьте.
# parameters.task_type: CPU — устройство CatBoost, не тип ML-задачи.

order:
  - null_rate: ${statistics.null_rate}
  - constants: ${statistics.constants}
  - catboost_rfe: ${catboost_rfe}

statistics:
  null_rate:
    threshold: 0.95
  constants:
    max_frequency: 0.98
    chunk_size: 1000

catboost_rfe:
  eval_months: 1
  max_rows: 500000
  sample_fraction: 0.1
  parameters:
    use_best_model: true
    max_ctr_complexity: 1
    boosting_type: Plain
    bootstrap_type: MVS
    task_type: CPU
    depth:
      type: int
      min: 3
      max: 7
    l2_leaf_reg:
      type: float
      min: 1.0e-8
      max: 10.0
      log: true
    min_data_in_leaf:
      type: int
      min: 1
      max: 20
  optuna_params:
    enabled: true
    n_trials: 30
    n_startup_trials: 10
    sampler: TPE
    timeout: 18000
  feature_selection_params:
    algorithm: RecursiveByLossFunctionChange
    steps: 20
  selection:
    max_features: 256

execution:
  seed: 42
  task_type: classification
  max_local_rows: 1000000
