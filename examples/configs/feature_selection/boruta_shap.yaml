# Только BorutaSHAP (precise-стадия).
#
# Сравнивает признак с его перемешанной копией. Стоимость растёт от СТРОК
# (SHAP на каждой из boruta_trials), не от числа колонок — режьте max_rows.
# По умолчанию оценивает continuous и categorical нативно.
# model_type: lgbm | rf. task_type = schema.task_type (все три задачи).
# Обычно ставят после статистик или lightgbm; один этот шаг — для отладки.

order:
  - boruta_shap: ${boruta_shap}

boruta_shap:
  model_type: lgbm
  n_jobs: -1
  seed: 17
  categorical_handling:
    mode: native
  max_rows: 250000
  sample_fraction: null
  boruta_trials: 50
  tentative_fix_method: rough
  parameters:
    boosting_type: gbdt
    num_leaves:
      type: int
      min: 16
      max: 255
    colsample_bytree:
      type: float
      min: 0.5
      max: 1.0
    subsample:
      type: float
      min: 0.5
      max: 1.0
    min_child_weight:
      type: float
      min: 1.0e-3
      max: 10.0
      log: true
  optuna_params:
    enabled: true
    n_trials: 20
    n_startup_trials: 5
    sampler: TPE
    timeout: 3600

execution:
  seed: 42
  task_type: binary_classification
  max_local_rows: 1000000
