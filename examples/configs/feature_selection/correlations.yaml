# Шаги пайплайна. Повторы метода с разными параметрами разрешены.
order:
  - null_rate: ${statistics.null_rate}
  - low_variance: ${statistics.low_variance}
  - constants: ${statistics.constants}
  - correlation: ${statistics.correlation}

statistics:
  null_rate:
    threshold: 0.95
  low_variance:
    min_variance: 0.001
    scale_method: "standard"
  constants:
    max_frequency: 0.98
    chunk_size: 1000
  correlation:
    threshold: 0.98
    max_rows: 500_000

model:
  enabled: false
  method: lightgbm
  params: {}
  selection:
    max_features: 100
  cross_validation:
    strategy: stratified
    folds: 5
    metric: roc_auc

execution:
  seed: 42
  allow_local_fallback: true
  # Used by stages that still materialise locally (e.g. correlation). Unused by constants.
  max_local_rows: 1000000
  local_memory_limit: 4
  local_sample:
    strategy: stratified
    cache_intermediate: true
