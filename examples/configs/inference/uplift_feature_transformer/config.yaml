weights_path: "model.bin"
model:
  _target_: fmlib.nn.models.FeatureTransformer
  embedding:
    _target_: fmlib.nn.embedding.FeatureEmbedding
    numerical_feature_count: 189
    embedding_dim: 64
    vocab_size: 172
    std_noise: null
    # Early fusion option
    hidden_state_aggregator:
      _target_: fmlib.nn.embedding.LayerNormConcatenate
      hidden_state_dim: 128  # Размерность external hidden_state
      embedding_dim: ${model.embedding.embedding_dim}
  num_encoder_layers: 3
  encoder_block:
    _target_: fmlib.nn.blocks.EncoderBlock
    hidden_dim: ${model.embedding.embedding_dim}
    num_heads: 4
    attn_dropout: 0.15
    dropout: ${model.encoder_block.attn_dropout}
    ffn:
      _target_: fmlib.nn.blocks.STEv2FFN
      model_dim: ${model.embedding.embedding_dim}
      linear_dim: 256  # ${model.embedding.embedding_dim} * 4
      dropout: ${model.encoder_block.attn_dropout}
  aggregation_layer:
    _target_: fmlib.nn.utils.agg.LinearAggregation
    num_features: 244 # Размер hidden_state на выходе из STEv2 (243) + 1 (если был early fusion)
    embedding_dim: ${model.embedding.embedding_dim}
  # Late fusion option
  late_fusion_layer_norm:
    _target_: torch.nn.LayerNorm
    normalized_shape: 128 # Размерность external hidden_state
  head:
    _target_: fmlib.nn.models.heads.FeatureTransformerClassificationHead
    hidden_dim: 192  # ${model.encoder_block.embedding_dim} + ${model.late_fusion_layer_norm.normalized_shape}
    num_classes: 2
    dropout: 0.15
  output_names:
    - "logits"

weights_mapping:
  # embedding
  encoder.backbone.embedding.cat_embed.weight: "embedding.cat_embed.weight"
  encoder.backbone.embedding.num_embed.weight: "embedding.num_embed.weight"
  encoder.backbone.embedding.num_embed.bias:   "embedding.num_embed.bias"

  # Early fusion option
  encoder.backbone.embedding.hidden_state_aggregator.layer_norm.bias:   "embedding.hidden_state_aggregator.layer_norm.bias"
  encoder.backbone.embedding.hidden_state_aggregator.layer_norm.weight: "embedding.hidden_state_aggregator.layer_norm.weight"
  encoder.backbone.embedding.hidden_state_aggregator.proj.bias:         "embedding.hidden_state_aggregator.proj.bias"
  encoder.backbone.embedding.hidden_state_aggregator.proj.weight:       "embedding.hidden_state_aggregator.proj.weight"

  # transformer blocks
  encoder.backbone.stev2_block.encoder_blocks.0.multi_head_attn.in_proj_bias:    "transformer_blocks.0.multi_head_attn.in_proj_bias"
  encoder.backbone.stev2_block.encoder_blocks.0.multi_head_attn.in_proj_weight:  "transformer_blocks.0.multi_head_attn.in_proj_weight"
  encoder.backbone.stev2_block.encoder_blocks.0.multi_head_attn.out_proj.bias:   "transformer_blocks.0.multi_head_attn.out_proj.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.multi_head_attn.out_proj.weight: "transformer_blocks.0.multi_head_attn.out_proj.weight"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.w1.bias:                     "transformer_blocks.0.ffn.w1.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.w1.weight:                   "transformer_blocks.0.ffn.w1.weight"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.w2.bias:                     "transformer_blocks.0.ffn.w2.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.w2.weight:                   "transformer_blocks.0.ffn.w2.weight"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.norm.bias:                   "transformer_blocks.0.ffn.norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.ffn.norm.weight:                 "transformer_blocks.0.ffn.norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.0.input_sublayer.norm.bias:        "transformer_blocks.0.attention_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.input_sublayer.norm.weight:      "transformer_blocks.0.attention_norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.0.output_sublayer.norm.bias:       "transformer_blocks.0.ffn_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.0.output_sublayer.norm.weight:     "transformer_blocks.0.ffn_norm.weight"

  encoder.backbone.stev2_block.encoder_blocks.1.multi_head_attn.in_proj_bias:    "transformer_blocks.1.multi_head_attn.in_proj_bias"
  encoder.backbone.stev2_block.encoder_blocks.1.multi_head_attn.in_proj_weight:  "transformer_blocks.1.multi_head_attn.in_proj_weight"
  encoder.backbone.stev2_block.encoder_blocks.1.multi_head_attn.out_proj.bias:   "transformer_blocks.1.multi_head_attn.out_proj.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.multi_head_attn.out_proj.weight: "transformer_blocks.1.multi_head_attn.out_proj.weight"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.w1.bias:                     "transformer_blocks.1.ffn.w1.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.w1.weight:                   "transformer_blocks.1.ffn.w1.weight"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.w2.bias:                     "transformer_blocks.1.ffn.w2.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.w2.weight:                   "transformer_blocks.1.ffn.w2.weight"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.norm.bias:                   "transformer_blocks.1.ffn.norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.ffn.norm.weight:                 "transformer_blocks.1.ffn.norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.1.input_sublayer.norm.bias:        "transformer_blocks.1.attention_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.input_sublayer.norm.weight:      "transformer_blocks.1.attention_norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.1.output_sublayer.norm.bias:       "transformer_blocks.1.ffn_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.1.output_sublayer.norm.weight:     "transformer_blocks.1.ffn_norm.weight"

  encoder.backbone.stev2_block.encoder_blocks.2.multi_head_attn.in_proj_bias:    "transformer_blocks.2.multi_head_attn.in_proj_bias"
  encoder.backbone.stev2_block.encoder_blocks.2.multi_head_attn.in_proj_weight:  "transformer_blocks.2.multi_head_attn.in_proj_weight"
  encoder.backbone.stev2_block.encoder_blocks.2.multi_head_attn.out_proj.bias:   "transformer_blocks.2.multi_head_attn.out_proj.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.multi_head_attn.out_proj.weight: "transformer_blocks.2.multi_head_attn.out_proj.weight"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.w1.bias:                     "transformer_blocks.2.ffn.w1.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.w1.weight:                   "transformer_blocks.2.ffn.w1.weight"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.w2.bias:                     "transformer_blocks.2.ffn.w2.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.w2.weight:                   "transformer_blocks.2.ffn.w2.weight"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.norm.bias:                   "transformer_blocks.2.ffn.norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.ffn.norm.weight:                 "transformer_blocks.2.ffn.norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.2.input_sublayer.norm.bias:        "transformer_blocks.2.attention_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.input_sublayer.norm.weight:      "transformer_blocks.2.attention_norm.weight"
  encoder.backbone.stev2_block.encoder_blocks.2.output_sublayer.norm.bias:       "transformer_blocks.2.ffn_norm.bias"
  encoder.backbone.stev2_block.encoder_blocks.2.output_sublayer.norm.weight:     "transformer_blocks.2.ffn_norm.weight"

  # aggregation_layer
  encoder.agg_layer.agg_features.bias:   "agg_layer.agg_features.bias"
  encoder.agg_layer.agg_features.weight: "agg_layer.agg_features.weight"
  encoder.agg_layer.layer_norm.bias:     "agg_layer.layer_norm.bias"
  encoder.agg_layer.layer_norm.weight:   "agg_layer.layer_norm.weight"
  encoder.agg_layer.proj.bias:           "agg_layer.proj.bias"
  encoder.agg_layer.proj.weight:         "agg_layer.proj.weight"

  # Late fusion option
  encoder.layer_norm.bias:   "late_fusion_layer_norm.bias"
  encoder.layer_norm.weight: "late_fusion_layer_norm.weight"

  # classification_head
  out_head.1.bias:                "head.out_head.1.bias"
  out_head.1.weight:              "head.out_head.1.weight"
  out_head.3.bias:                "head.out_head.3.bias"
  out_head.3.weight:              "head.out_head.3.weight"
  out_head.3.num_batches_tracked: "head.out_head.3.num_batches_tracked"
  out_head.3.running_mean:        "head.out_head.3.running_mean"
  out_head.3.running_var:         "head.out_head.3.running_var"
  out_head.4.bias:                "head.out_head.4.bias"
  out_head.4.weight:              "head.out_head.4.weight"
