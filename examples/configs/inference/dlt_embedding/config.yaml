weights_path: "weights.safetensors"

parameters:
  vocab: 5760
  pos_vocab: 384
  ffn_dim: 2048
  hidden_dim: 512
  num_heads: 8
  local_model_layers: 2
  main_model_layers: 15
  patch_size: 86400
  local_attn_res: 300
  drop_rate: 0.1

model:
  _target_: fmlib.nn.models.DLTEmbedding
  base_model:
    _target_: fmlib.nn.models.DLTBody
    embedding_layer:
      _target_: torch.nn.Embedding
      num_embeddings: ${parameters.vocab}
      embedding_dim: ${parameters.hidden_dim}
    pos_embedding_layer:
      _target_: torch.nn.Embedding
      num_embeddings: ${parameters.pos_vocab}
      embedding_dim: ${parameters.hidden_dim}
    input_encoder:
      _target_: fmlib.nn.blocks.RotaryEncoderBlock
      num_heads: ${parameters.num_heads}
      hidden_dim: ${parameters.hidden_dim}
      dropout: ${parameters.drop_rate}
      use_rotary: False
      ffn: 
        _target_: fmlib.nn.blocks.DropoutLastPositionWiseFFN
        linear_dim: ${parameters.ffn_dim}
        model_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
    local_cross_encoder:
      _target_: fmlib.nn.blocks.RotaryCrossEncoderModel
      encoder_layer_template:
        _target_: fmlib.nn.blocks.RotaryEncoderBlock
        num_heads: ${parameters.num_heads}
        hidden_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
        use_rotary: True
        ffn: ${model.base_model.input_encoder.ffn}
      cross_layer_template:
        _target_: fmlib.nn.blocks.CrossEncoderBlock
        num_heads: ${parameters.num_heads}
        hidden_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
        ffn: ${model.base_model.input_encoder.ffn}
      num_layers: ${parameters.local_model_layers}
    patches_decoder:
      _target_: fmlib.nn.blocks.RotaryDecoderModel
      layer_template:
        _target_: fmlib.nn.blocks.RotaryEncoderBlock
        num_heads: ${parameters.num_heads}
        hidden_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
        use_rotary: True
        ffn: ${model.base_model.input_encoder.ffn}
      num_layers: ${parameters.main_model_layers}
      hidden_dim: ${parameters.hidden_dim}
      dropout: ${parameters.drop_rate}
    hidden_dim: ${parameters.hidden_dim}
    patch_size: ${parameters.patch_size}
    local_attn_res: ${parameters.local_attn_res}
    dropout: ${parameters.drop_rate}
  

inference_transform:
  _target_: fmlib.nn.transforms.make_for_dlt

