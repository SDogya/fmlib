seed: 42

events_meta:
  evt_attr_9:
    type: categorical
    cardinality: 524
    event_id: 0
  evt_attr_15:
    type: numerical
    event_id: 0
  channel_group:
    type: categorical
    cardinality: 10
    event_id: 2
  sale_product_class_id:
    type: categorical
    cardinality: 39
    event_id: 2

model:
  _target_: fmlib.nn.models.SequenceRepresentationModel
  embedding:
    _target_: fmlib.nn.embedding.EventEmbedding
    embedding_dim: 128
    columns_meta: ${events_meta}
  time_embedding:
    _target_: fmlib.nn.embedding.LinearEmbedding
    embedding_dim: ${model.embedding.embedding_dim}
    feature_count: 1
  feature_encoder_block:
    _target_: fmlib.nn.blocks.EventEncoderBlock
    hidden_dim: ${model.embedding.embedding_dim}
    attn_dropout: 0.0
    dropout: 0.1
    ffn:
      _target_: fmlib.nn.blocks.FeatureFFN
      model_dim: ${model.embedding.embedding_dim}
      linear_dim: 512 # ${model.embedding.embedding_dim} * 4
      feature_dim: 5 # количество признаков + 1 (если есть time_embedding)
      dropout: ${model.feature_encoder_block.dropout}
  transformer_model:
    _target_: transformers.GPT2Model
    config:
      _target_: transformers.GPT2Config
      n_positions: 128
      vocab_size: 0 # может быть любое значение, так как nn.Embedding gpt мы не используем
      n_embd: ${model.embedding.embedding_dim}
      n_layer: 2
      n_head: 2
      pad_token_id: 0
      bos_token_id: 1
      eos_token_id: 2
  aggregation_layer:
    _target_: fmlib.nn.utils.agg.MeanHiddenState
  event_names:
    - "evt_attr_9"
    - "evt_attr_15"
    - "channel_group"
    - "sale_product_class_id"
  output_names:
    - "logits"
    - "last_hidden_state"

evaluation_step_callbacks:
  _target_: fmlib.training.callbacks.step.GroupedStepCallback
  callbacks:
    - _target_: fmlib.training.callbacks.step.WriterCallback
      base_path: "/home/datalab/nfs/body_results"
      output_to_save: ["logits", "last_hidden_state"]
      transformed_to_save: ["epk_id"]


accelerator:
  _target_: accelerate.Accelerator
  kwargs_handlers:
    - _target_: accelerate.utils.DistributedDataParallelKwargs
      find_unused_parameters: True

evaluation_transform:
  _target_: fmlib.nn.transforms.make_for_sequence_representation
  events_meta: ${events_meta}
  time_encoding: "delta"
  bypass: ["epk_id"]

autocast:
  _target_: fmlib.training.utils.autocast.make_autocast_wrapper
  do_autocast: False

metadata:
  epk_id: {}
  evt_attr_15:
    sequential: true
    sequence_length: 128
    padding: 0
  evt_attr_9:
    sequential: true
    sequence_length: 128
    padding: 0
  channel_group:
    sequential: true
    sequence_length: 128
    padding: 0
  sale_product_class_id:
    sequential: true
    sequence_length: 128
    padding: 0
  evt_dttm:
    sequential: true
    sequence_length: 128
    padding: 0
  event_ids:
    sequential: true
    sequence_length: 128
    padding: 0

evaluation_data:
  _target_: fmlib.data.io.parquet_dataset.ParquetDataset
  source: "/home/datalab/nfs/data/sequence_representation_2M/processed_sequences"
  metadata: ${metadata}
  partition_size: 131072
  batch_size: 128
