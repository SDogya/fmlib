seed: 42

parameters:
  vocab: 5760
  pos_vocab: 384
  ffn_dim: 2048
  hidden_dim: 512
  num_heads: 8
  local_model_layers: 2
  main_model_layers: 15
  patch_size: 86400
  local_attn_res: 300
  drop_rate: 0.1

model:
  _target_: fmlib.nn.models.DLTClassification
  base_model:
    _target_: fmlib.nn.utils.freeze.freeze_model
    model:
      _target_: fmlib.nn.models.DLTBody
      embedding_layer:
        _target_: torch.nn.Embedding
        num_embeddings: ${parameters.vocab}
        embedding_dim: ${parameters.hidden_dim}
      pos_embedding_layer:
        _target_: torch.nn.Embedding
        num_embeddings: ${parameters.pos_vocab}
        embedding_dim: ${parameters.hidden_dim}
      input_encoder:
        _target_: fmlib.nn.blocks.RotaryEncoderBlock
        num_heads: ${parameters.num_heads}
        hidden_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
        use_rotary: False
        ffn: 
          _target_: fmlib.nn.blocks.DropoutLastPositionWiseFFN
          linear_dim: ${parameters.ffn_dim}
          model_dim: ${parameters.hidden_dim}
          dropout: ${parameters.drop_rate}
      local_cross_encoder:
        _target_: fmlib.nn.blocks.RotaryCrossEncoderModel
        encoder_layer_template:
          _target_: fmlib.nn.blocks.RotaryEncoderBlock
          num_heads: ${parameters.num_heads}
          hidden_dim: ${parameters.hidden_dim}
          dropout: ${parameters.drop_rate}
          use_rotary: True
          ffn: ${model.base_model.model.input_encoder.ffn}
        cross_layer_template:
          _target_: fmlib.nn.blocks.CrossEncoderBlock
          num_heads: ${parameters.num_heads}
          hidden_dim: ${parameters.hidden_dim}
          dropout: ${parameters.drop_rate}
          ffn: ${model.base_model.model.input_encoder.ffn}
        num_layers: ${parameters.local_model_layers}
      patches_decoder:
        _target_: fmlib.nn.blocks.RotaryDecoderModel
        layer_template:
          _target_: fmlib.nn.blocks.RotaryEncoderBlock
          num_heads: ${parameters.num_heads}
          hidden_dim: ${parameters.hidden_dim}
          dropout: ${parameters.drop_rate}
          use_rotary: True
          ffn: ${model.base_model.model.input_encoder.ffn}
        num_layers: ${parameters.main_model_layers}
        hidden_dim: ${parameters.hidden_dim}
        dropout: ${parameters.drop_rate}
      hidden_dim: ${parameters.hidden_dim}
      patch_size: ${parameters.patch_size}
      local_attn_res: ${parameters.local_attn_res}
      dropout: ${parameters.drop_rate}
  output_layer_template:
    _target_: fmlib.nn.models.heads.DLTClassificationHead
    hid_dim: ${parameters.hidden_dim}
  output_layers:
    - vacation_home_d30

training_step_callbacks:
  _target_: fmlib.training.callbacks.step.GroupedStepCallback
  callbacks: []

validation_step_callbacks:
  _target_: fmlib.training.callbacks.step.GroupedStepCallback
  callbacks:
    - _target_: fmlib.training.callbacks.step.RocAucCallback
      output_slice: 
        - _target_: hydra.utils.get_object
          path: builtins.Ellipsis
        - 1
      metric_name: "roc_auc_validation"
      target_name: "vacation_home_d30"
      output_name: "vacation_home_d30"
    - _target_: fmlib.training.callbacks.step.AtFixedCallback
      output_slice: 
        - _target_: hydra.utils.get_object
          path: builtins.Ellipsis
        - 1
      fixed_recalls: [0.01 , 0.05, 0.1, 0.25, 0.5, 0.9]
      fixed_precisions: [0.1, 0.25, 0.5, 0.75, 0.9]
      target_name: "vacation_home_d30"
      output_name: "vacation_home_d30"

optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001

scheduler:
  _target_: transformers.optimization.get_scheduler
  name: cosine
  num_warmup_steps: 1
  num_training_steps: 30

accelerator:
  _target_: accelerate.Accelerator

training_transform:
  _target_: fmlib.nn.transforms.make_for_dlt
  bypass: ["epk_id", "report_dt", "vacation_home_d30"]
  mask_proba: 0.1

validation_transform:
  _target_: fmlib.nn.transforms.make_for_dlt
  bypass: ["epk_id", "report_dt", "vacation_home_d30"]

autocast:
  _target_: fmlib.training.utils.autocast.make_autocast_wrapper
  do_autocast: True

losses:
  _target_: fmlib.nn.losses.CombinedLoss
  losses:
    tabular_loss:
      _target_: fmlib.nn.losses.WrappedLoss
      target_type:
        _target_: hydra.utils.get_object
        path: torch.int64
      target_name: "vacation_home_d30"
      output_name: "vacation_home_d30"
      loss_to_wrap:
        _target_: torch.nn.CrossEntropyLoss

metadata:
  epk_id: {}
  report_dt: {}
  vacation_home_d30: {}
  date_stamp:
    sequential: true
    sequence_length: 2048
    padding: 0
  dir_token:
    sequential: true
    sequence_length: 2048
    padding: 0
  ecom_token:
    sequential: true
    sequence_length: 2048
    padding: 0
  mcc_token:
    sequential: true
    sequence_length: 2048
    padding: 0
  brand_token:
    sequential: true
    sequence_length: 2048
    padding: 0
  city_token:
    sequential: true
    sequence_length: 2048
    padding: 0
  amt_token:
    sequential: true
    sequence_length: 2048
    padding: 0

training_data:
  _target_: fmlib.data.io.parquet_dataset.ParquetDataset
  source: "/home/datalab/nfs/romashka_train_data"
  metadata: ${metadata}
  partition_size: 4096
  batch_size: 16
  generator:
    _target_: fmlib.utils.generator.make_seeded_generator
    seed: ${seed}

validation_data:
  _target_: fmlib.data.io.parquet_dataset.ParquetDataset
  source: "/home/datalab/nfs/romashka_test_data"
  metadata: ${metadata}
  partition_size: 4096
  batch_size: 16

epoch_callbacks:
  _target_: fmlib.training.callbacks.epoch.GroupedEpochCallback
  callbacks:
    - _target_: fmlib.training.callbacks.epoch.EarlyStoppingCallback
      metric_to_track: "roc_auc_validation"
      patience: 6
    - _target_: fmlib.training.callbacks.epoch.LoggingEpochCallback
    - _target_: fmlib.training.callbacks.epoch.SaveCheckpointCallback
      base_path: "/home/datalab/nfs/checkpoints/test_dlt_roc_auc"
      metric_to_track: "roc_auc_validation"
      num_checkpoints: 10
    - _target_: fmlib.training.callbacks.epoch.SaveCheckpointCallback
      base_path: "/home/datalab/nfs/checkpoints/test_dlt_precision"
      metric_to_track: "precision@0.1"
      num_checkpoints: 10

epoch_iterable:
  _target_: fmlib.training.callbacks.epoch.EarlyStoppingIterable
  max_iter: 20

weights_ignore_pattern: "output_layers.*"

