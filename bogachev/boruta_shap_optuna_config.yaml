# Пример конфигурации BorutaSHAP с Optuna grid search
# Файл: boruta_shap_optuna_config.yaml

datasets:
  my_dataset:
    enabled: true
    methods:
      boruta_shap:
        enabled: true
        model_type: "lgbm"
        boruta_trials: 30
        parameters:
          n_estimators:
            type: int
            min: 100
            max: 1400
          num_leaves:
            type: int
            min: 8
            max: 64
          max_depth:
            type: int
            min: 4
            max: 7
          learning_rate:
            type: float
            min: 0.01
            max: 0.1
            log: true
          min_child_samples:
            type: int
            min: 16
            max: 64
          subsample:
            type: float
            min: 0.7
            max: 1.0
          colsample_bytree:
            type: float
            min: 0.7
            max: 1.0
          reg_alpha:
            type: float
            min: 0.01
            max: 1.0
            log: true
          reg_lambda:
            type: float
            min: 0.01
            max: 1.0
            log: true
          boosting_type:
            type: categorical
            values:
              - gbdt
              - dart
              - goss
        optuna_params:
          n_trials: 100
          n_startup_trials: 50
          sampler: TPE

# Глобальные параметры также можно использовать:
# global_methods:
#   boruta_shap:
#     enabled: true
#     ...
