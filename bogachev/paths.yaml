# Конфигурация путей для тестирования методов отбора признаков

datasets:
  PD:
    enabled: true
    path: /user/team/team_ai_avatar/ds/rusakov/feature_selection_benchmark/benchmark_datasets/product_name=pd_cc
    has_split_type: true

  TD:
    enabled: true
    path: /user/team/team_ai_avatar/ds/rusakov/feature_selection_benchmark/benchmark_datasets/product_name=tdbase_response
    has_split_type: true

  SA_SMA:
    enabled: true
    path: /user/team/team_ai_avatar/ds/zaripov/feature_selection_benchmark/product_name=sa_response_sms
    has_split_type: false

  SA_ERKC:
    enabled: true
    path: /user/team/team_ai_avatar/ds/zaripov/feature_selection_benchmark/product_name=sa_response_erkc
    has_split_type: false

# Глобальные параметры для методов (можно переопределять для каждого датасета)
global_methods:
  order:
    - drop_null
    - drop_constant
    - drop_low_variance
    - drop_correlated
    - lgbm_shap

  drop_null:
    enabled: false
    params:
      - 0.9
      - 0.95
      - 0.99

  drop_constant:
    enabled: false
    params:
      - 0.95
      - 0.99
      - 1.0

  drop_low_variance:
    enabled: false
    params:
      scale_methods:
        - standard
      values:
        - 0.001
        - 0.005
        - 0.01

  drop_correlated:
    enabled: true
    params:
      - 0.9
      - 0.95
      - 0.98

  lgbm_shap:
    enabled: false
    params:
      - 0.9
      - 0.95
      - 0.98
