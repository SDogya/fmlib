# New pipeline configuration format
# Simple, scalable, easy to extend

# Global settings
settings:
  results_dir: results
  log_level: INFO
  exclude_patterns:
    - id
    - date
    - time
    - split
    - epoch
    - seq
    - report
    - row

# Pipeline steps - executed in order
# Each step defines: name, params (optional), enabled (optional)
steps:
  # Step 1: Stratified sampling (optional, for large datasets)
  - name: stratified_sampling
    params:
      max_rows: 750000
    enabled: true

  # Step 2: Drop columns with too many null values
  - name: drop_null
    params:
      max_null_fraction: 0.5
    enabled: false

  # Step 3: Drop constant features
  - name: drop_constant
    params:
      tol: 0.98
      chunk_size: 1000
    enabled: true

  # Step 4: Drop low variance features
  # Can test multiple variance values by providing lists
  - name: drop_low_variance
    params:
      min_variance: [1e-5, 1e-4]
      scale_method: [standard, minmax]
      chunk_size: 1000
    enabled: true

  # Step 5: Drop correlated features
  - name: drop_correlated
    params:
      corr_threshold: 0.95
    enabled: true

  # Step 6: Feature selection with LGBM + SHAP
  - name: lgbm_shap
    params:
      threshold: 0.85
      max_rows_limit: 250000
    enabled: false

  # Step 7: Advanced feature selection with BorutaSHAP + Optuna
  - name: boruta_shap
    params:
      model_type: lgbm
      boruta_trials: 50
      parameters:
        n_estimators:
          type: int
          min: 100
          max: 1400
        num_leaves:
          type: int
          min: 8
          max: 64
        max_depth:
          type: int
          min: 4
          max: 7
        learning_rate:
          type: float
          min: 0.01
          max: 0.1
          log: true
        min_child_samples:
          type: int
          min: 16
          max: 64
        subsample:
          type: float
          min: 0.7
          max: 1.0
        colsample_bytree:
          type: float
          min: 0.7
          max: 1.0
        reg_alpha:
          type: float
          min: 0.01
          max: 1.0
          log: true
        reg_lambda:
          type: float
          min: 0.01
          max: 1.0
          log: true
        boosting_type:
          type: categorical
          values:
            - gbdt
            - dart
            - goss
      optuna_params:
        n_trials: 100
        n_startup_trials: 50
        sampler: TPE
    enabled: true

# Dataset configurations
datasets:
  SA_SMA:
    enabled: true
    path: /user/team/team_ai_avatar/ds/zaripov/feature_selection_benchmark/product_name=sa_response_sms
    has_split_type: false
    selected_cols_file: trueresults/pipeline/SA_SMA/stage_0_1_SELECTED.txt
    # Per-dataset overrides for step params
    steps:
      - name: stratified_sampling
        params:
          max_rows: 750000
      - name: boruta_shap
        params:
          boruta_trials: 50

  SA_ERKC:
    enabled: false
    path: /user/team/team_ai_avatar/ds/zaripov/feature_selection_benchmark/product_name=sa_response_erkc
    has_split_type: false
    selected_cols_file: trueresults/pipeline/SA_ERKC/stage_0_1_SELECTED.txt

  TD:
    enabled: false
    path: /user/team/team_ai_avatar/ds/rusakov/feature_selection_benchmark/benchmark_datasets/product_name=tdbase_response
    has_split_type: true
    selected_cols_file: trueresults/pipeline/TD/stage_0_1_SELECTED.txt

  PD:
    enabled: false
    path: /user/team/team_ai_avatar/ds/rusakov/feature_selection_benchmark/benchmark_datasets/product_name=pd_cc
    has_split_type: true
    selected_cols_file: trueresults/pipeline/PD/stage_0_1_SELECTED.txt

# Add a new custom step (example)
# To add a new method:
# 1. Create a class in new_pipeline.py extending Step
# 2. Add it to the _create_step factory method
# 3. Configure here:
# custom_steps:
#   - name: drop_high_cardinality
#     params:
#       max_cardinality: 10000
