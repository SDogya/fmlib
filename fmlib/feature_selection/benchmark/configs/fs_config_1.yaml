benchmark:
  seed: 42
  n_splits: 3
  run_baseline: True
  output_dir: /home/datalab/nfs/fs_output/baseline_1

optuna:
  n_trials: 40
  timeout_seconds: null
  n_jobs: 1
  show_progress_bar: true
  storage: null
  load_if_exists: false

catboost:
  thread_count: -1
  early_stopping_rounds: 50
  fixed_params:
    task_type: "GPU"
    boosting_type: "Plain"
    grow_policy: "SymmetricTree"
    bootstrap_type: "MVS"
    border_count: 64
  search_space:
    iterations:
      type: int
      low: 100
      high: 1400
    depth:
      type: int
      low: 4
      high: 7
    learning_rate:
      type: float
      low: 0.01
      high: 0.1
      log: true
    l2_leaf_reg:
      type: float
      low: 0.1
      high: 1.0
      log: true
    random_strength:
      type: float
      low: 0.05
      high: 0.2
      log: true
    subsample:
      type: float
      low: 0.6
      high: 0.9

# Add one entry for every fixed dataset. Relative paths are resolved from this
# config's directory. "feature_sets" maps an approach name to columns removed
# by that approach; the script always adds an empty "baseline" automatically.
datasets:
  - name: pd_cc
    train_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=pd_cc/split_type=train
    valid_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=pd_cc/split_type=valid
    test_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=pd_cc/split_type=test
    target: "target_attr_1"
    technical_columns: ${technical_cols}
    id_columns: ${id_cols}
    enforce_disjoint_ids: false
    categorical_columns: ${cat_cols}
    continuous_columns: ${num_cols}
    feature_sets:
      null_0_9: /home/datalab/nfs/fs_benchmark/fs_approaches/PD/null_0.9_cols.txt
      null_0_99: /home/datalab/nfs/fs_benchmark/fs_approaches/PD/null_0.99_cols.txt
      null_0_95: /home/datalab/nfs/fs_benchmark/fs_approaches/PD/null_0.95_cols.txt

  - name: sa_response_sms
    train_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=sa_response_sms/split_type=train
    valid_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=sa_response_sms/split_type=valid
    test_path: /home/datalab/projects/avatar/avatards/zaripov_glebasta/feature_selection_benchmark/product_name=sa_response_sms/split_type=test
    target: "target_attr_1"
    technical_columns: ${technical_cols}
    id_columns: ${id_cols}
    enforce_disjoint_ids: false
    categorical_columns: ${cat_cols}
    continuous_columns: ${num_cols}
    group_column: target_attr_3
    feature_sets:
      null_0_9: /home/datalab/nfs/fs_benchmark/fs_approaches/SA_SMS/null_0.9_cols.txt
      null_0_99: /home/datalab/nfs/fs_benchmark/fs_approaches/SA_SMS/null_0.99_cols.txt
      null_0_95: /home/datalab/nfs/fs_benchmark/fs_approaches/SA_SMS/null_0.95_cols.txt



