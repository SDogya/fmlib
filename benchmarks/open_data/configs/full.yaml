# The recommended shape: cheap filters first, so the expensive stage sees a
# smaller matrix, then the model stage on what survived.
order:
  - null_rate:
      threshold: 0.95
  - constants:
      max_frequency: 0.999
      chunk_size: 500
  - low_variance:
      min_variance: 0.01
      scale_method: robust
  - psi:
      mode: month_over_month
      threshold: 0.25
      num_bins: 10
      month_column: month_part
      test_months: 4
      max_levels: 50
      n_jobs: 8
  - correlation:
      method: pearson
      threshold: 0.95
      tie_break: null_rate
      max_rows: 100000
  - iv:
      threshold: 0.02
      max_threshold: 3.0
      num_bins: 10
      max_levels: 50
  - lightgbm:
      n_folds: 3
      max_rows: 200000
      shap_max_rows: 20000
      lgbm_threshold: 0.95
      shap_threshold: 0.95
      selection_mode: aggregated
      n_jobs: 8
      seed: 42
      optuna_params:
        enabled: false
      parameters:
        n_estimators: 300
        learning_rate: 0.05
        num_leaves: 63
        min_child_samples: 50
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.8

execution:
  seed: 42
  max_local_rows: 500000
